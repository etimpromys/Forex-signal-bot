name: Forex Signal Bot

on:
  schedule:
    # Every 15 minutes. Adjust to match config.DATA_INTERVAL.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

permissions:
  contents: write   # needed to commit the updated state.json back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          AI_PROVIDER: none
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config --global user.name "forex-bot"
          git config --global user.email "forex-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update signal state [skip ci]"
          git push
