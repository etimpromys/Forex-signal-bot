name: Backtest HTF Trend Filter

# Manual trigger only -- this is a one-off analysis job, not a recurring
# schedule. Run it from the Actions tab whenever you want to test the
# hypothesis, not on a timer.
on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HTF backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backtest_htf_filter.py

      - name: Upload results CSV
        uses: actions/upload-artifact@v4
        with:
          name: htf-backtest-results
          path: htf_backtest_results.csv
